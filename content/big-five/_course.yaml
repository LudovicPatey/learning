title: The Big Five
area: reverse-math
level: Advanced
order: 2
prerequisites: [second-order-arithmetic, pi01-classes]
summary: ACA₀, WKL₀, ATR₀ and Π¹₁-CA₀, their ω-models, and the theorems equivalent to each.
description: >
  The systems of the Big Five beyond the base theory: arithmetic comprehension
  and its equivalent forms, with the reversals of monotone convergence, of the
  existence of torsion subgroups and of König's lemma; weak König's lemma with
  Scott ideals and a model of low sets, Σ⁰₁ separation and the Heine–Borel
  theorem; and a survey of arithmetic transfinite recursion and Π¹₁
  comprehension.
objectives:
  - Prove the main equivalent forms of ACA₀ and characterize its ω-models
  - Carry out reversals to ACA₀ by coding the range of an injection into an instance
  - Show that monotone convergence, torsion subgroups and König's lemma are equivalent to ACA₀
  - Characterize the ω-models of WKL₀ and separate WKL₀ from ACA₀
  - Prove the equivalence of WKL₀ with Σ⁰₁ separation and the Heine–Borel theorem
  - Define ATR₀ and Π¹₁-CA₀ and state their main equivalents and separations
lessons: [aca0, aca0-reversals, wkl0, separation-heine-borel, atr0-pi11ca0]
