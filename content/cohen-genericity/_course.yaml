title: Cohen genericity
area: computability
level: Advanced
order: 8
prerequisites: [turing-degrees, arithmetic-hierarchy]
summary: Effective forcing with finite strings; weakly generic and n-generic sets, their degrees and their jumps.
description: >
  Cohen forcing in its effective form: dense sets of strings and Baire category,
  weakly 1-generic sets and Kurtz's characterization of the hyperimmune degrees,
  forcing of Σ⁰₁ properties and the degrees of 1-generic sets, coding into generic
  sets (the Posner–Robinson and Friedberg jump inversion theorems), and n-generic
  sets with their jumps.
objectives:
  - Relate genericity for countable families of dense sets to co-meager classes
  - Prove Kurtz's theorem on weakly 1-generic sets and hyperimmune degrees
  - Use forcing with strings to decide Σ⁰₁ and Σ⁰ₙ properties
  - Show that 1-generic sets compute no DNC function and avoid cones
  - Prove the Posner–Robinson and Friedberg jump inversion theorems
  - Compute the jumps of n-generic sets
lessons: [baire-category, weak-genericity, one-genericity, posner-robinson, n-genericity]
