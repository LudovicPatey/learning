title: Computable ordinals
area: higher
level: Advanced
order: 1
prerequisites: [arithmetic-hierarchy, fundamentals]
summary: Well-orders, ordinal notations, the Church–Kleene ordinal ω₁ᶜᵏ, well-founded trees, Π¹₁ sets and Spector's boundedness theorem.
description: >
  The ordinals that can be described effectively: well-orderings and ordinals,
  computable well-orderings and the Church–Kleene ordinal, Kleene's system of
  notations O and effective transfinite recursion, the Markwald–Kleene theorem,
  well-founded trees and the Kleene–Brouwer ordering, the normal form of Π¹₁
  sets and the Π¹₁-completeness of well-ordering and of O, and Spector's
  boundedness theorem with its first applications.
objectives:
  - Manipulate well-orderings, ordinals and transfinite recursion
  - Work with computable well-orderings and know what an index does and does not reveal
  - Define Kleene's O and compute with notations by effective transfinite recursion
  - Prove that constructive and computable ordinals coincide
  - Relate well-founded trees, their ranks and the Kleene–Brouwer ordering
  - Prove the normal form theorem for Π¹₁ sets and the Π¹₁-completeness of WO and of O
  - Prove and apply Spector's boundedness theorem
lessons: [ordinals, computable-well-orderings, kleene-o, markwald, well-founded-trees, trees-and-pi11, boundedness]
