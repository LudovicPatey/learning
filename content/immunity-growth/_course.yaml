title: Immunity and growth of functions
area: computability
level: Advanced
order: 9
prerequisites: [turing-degrees, ce-degrees, pi01-classes]
summary: Immune and hyperimmune sets, computably dominated degrees, diagonally non-computable functions, and dominant functions.
description: >
  Weakness and strength measured by the growth of functions: immune, hyperimmune
  and hypersimple sets, truth-table reducibility, computably dominated degrees
  built by forcing with function trees, diagonally non-computable and
  fixed-point free functions with Arslanov's completeness criterion, Martin's
  characterization of the high degrees by dominant functions, and its
  applications to maximal sets and to functions that avoid all computable
  functions.
objectives:
  - Characterize hyperimmune sets by the growth of their principal functions
  - Construct hypersimple sets in every non-zero c.e. degree
  - Relate truth-table reducibility to total functionals and to computable domination
  - Build computably dominated sets by forcing with function trees
  - Prove the equivalence of DNC, fixed-point free and effectively immune degrees
  - Prove Arslanov's completeness criterion
  - Prove Martin's domination theorem and Jockusch's characterization of high sets by lists of computable sets
  - Show that maximal sets are high, and characterize the sets that are high or DNC
lessons: [immune-sets, hypersimple-sets, computably-dominated, dnc-functions, arslanov, domination, high-or-dnc]
