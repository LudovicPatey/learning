title: K-trivial sets
area: randomness
level: Advanced
order: 5
prerequisites: [martin-lof-randomness, ce-degrees]
summary: Sets of minimal prefix-free complexity, cost functions, and their coincidence with the sets that are low for randomness.
description: >
  The sets whose initial segments have the complexity of their lengths:
  Chaitin's counting theorem and the Δ⁰₂-ness of K-trivial sets, closure
  under join and weak truth-table reductions, Solovay functions, cost
  functions and the construction of a simple K-trivial set, lowness for K
  and for Martin-Löf randomness, bases for randomness and the hungry sets
  theorem, the amplification argument behind the decanter and golden run
  methods, and the coincidence of all these notions.
objectives:
  - Prove that there are countably many K-trivial sets, all Δ⁰₂
  - Show that K-triviality is preserved by joins and weak truth-table reductions
  - Build a simple K-trivial set with the standard cost function
  - Relate lowness for K, lowness for randomness and bases for randomness
  - Prove the hungry sets theorem
  - Use amplification to show that no K-trivial set is weak truth-table complete
  - Derive the ideal structure of the K-trivial sets from the main theorem
lessons: [k-trivial-sets, solovay-functions, cost-functions, lowness, hungry-sets, ktrivial-lowness]
