title: Kolmogorov complexity
area: randomness
level: Intermediate
order: 1
prerequisites: [fundamentals, turing-degrees]
summary: The length of the shortest description of a string, prefix-free machines, the coding theorem, and Chaitin's halting probability.
description: >
  The information content of finite strings measured by the length of their
  shortest descriptions: the invariance theorem, incompressible strings and the
  non-computability of complexity, the complexity of initial segments of infinite
  sequences and Chaitin's characterization of the computable sequences,
  prefix-free machines and the complexity K, the KC theorem, the coding theorem,
  and the halting probability Ω.
objectives:
  - Define plain and prefix-free complexity and prove the invariance theorems
  - Use counting arguments to show that most strings are incompressible
  - Prove that C is not computable, is approximable from above and computes the halting problem
  - Characterize the computable sequences by the complexity of their initial segments
  - Explain why plain complexity cannot define random sequences
  - Build prefix-free machines with the KC theorem
  - Relate K to output probabilities through the coding theorem
  - Prove that Ω is Turing complete and has incompressible prefixes
lessons: [plain-complexity, non-computability, initial-segments, computable-sequences, prefix-free-complexity, kc-theorem, coding-theorem]
