title: Models of computation
area: computability
level: Introductory
order: 1
summary: Turing machines and the partial recursive functions, their equivalence, Kleene's normal form theorem, the universal function, and the Church–Turing thesis.
description: >
  The notion of computable function, made precise in two ways: by a machine
  model, Turing machines, and by closure under schemes, the primitive and partial
  recursive functions. The course develops both far enough to program and verify
  non-trivial functions, codes finite sequences primitive recursively, shows that
  the Ackermann function is computable but not primitive recursive, and proves
  that the two definitions agree: Turing machines are arithmetized, which gives
  Kleene's normal form theorem and a universal function, and the schemes are
  simulated by multi-tape machines. It closes with the Church–Turing thesis.
  Register machines, structured programs and the λ-calculus are in the
  specialized course on other models of computation.
objectives:
  - State precisely the definitions of Turing machines and partial recursive functions, including input and output conventions
  - Write and verify Turing machines, and simulate multi-tape machines by single-tape machines
  - Prove that a function is primitive recursive using the standard closure properties
  - Code finite sequences of integers primitive recursively
  - Prove that the Ackermann function is not primitive recursive
  - Prove that the Turing-computable functions are the partial recursive functions, with Kleene's normal form theorem and the universal function
  - Explain the content and the use of the Church–Turing thesis
