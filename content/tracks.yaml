# Main learning tracks. Each track is a sequence of core courses in one area,
# displayed as a dependency graph on the home page. Courses that appear in no
# track are specialized courses: they are listed in the catalogue only.
# Prerequisites on courses of other tracks are shown as "Builds on".
# The reasons for the contents of each track are in tracks-design.md.
- id: computability
  title: Computability theory
  area: computability
  description: >
    From the models of computation to the structure of the Turing degrees: the
    common basis of the other tracks.
  courses: [models-of-computation, countability, fundamentals, turing-degrees, arithmetic-hierarchy, ce-degrees, pi01-classes, immunity-growth]
- id: randomness
  title: Algorithmic randomness
  area: randomness
  description: >
    Randomness of individual infinite sequences, through tests, incompressibility
    and betting strategies.
  courses: [kolmogorov-complexity, martin-lof-randomness, martingales]
- id: reverse-math
  title: Reverse mathematics
  area: reverse-math
  description: >
    The axioms needed to prove theorems of ordinary mathematics, measured over a
    weak base theory.
  courses: [second-order-arithmetic, big-five, ramsey-theorem, induction-conservation, reducibilities]
- id: higher
  title: Higher computability
  area: higher
  description: >
    Computability along the computable ordinals, beyond the arithmetic sets.
  courses: [computable-ordinals, hyperarithmetic, descriptive-set-theory]
- id: avoidance
  title: Lowness and avoidance
  area: computability
  description: >
    Separating mathematical problems by preservation properties, with the forcing
    question as the main tool: cone avoidance, lowness, compactness avoidance, and the
    control of the first and second jumps.
  courses: [effective-forcing, avoidance, lowness, compactness-avoidance, separation-design, jump-cone-avoidance, jump-compactness-avoidance]
- id: arithmetic
  title: Models of arithmetic
  area: arithmetic
  description: >
    Fragments of Peano arithmetic and their models: induction and collection, truth
    definitions, cuts and end extensions, recursive saturation, and the independence of
    combinatorial statements.
  courses: [fragments-of-arithmetic, truth-and-provability, cuts-and-extensions, independence]
